<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cricket Auction Night: a free two-player cricket auction game. Bid for international stars and legend coaches, then reveal secret ratings to crown the champion.">
<title>Cricket Auction Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Teko:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}

/* Layout: night-match auction hall. Left bidder | stage (player under the hammer) | right bidder. Old wooden scoreboard panels on a floodlit pitch. Single deliberate dark look. */
:root{
  --pitch:#0C2620; --pitch-2:#0F3129; --board:#143A31; --board-2:#1A463B; --line:#2C5C4E;
  --chalk:#F4ECDA; --muted:#A8BDB2; --faint:#6F8C80;
  --ball:#D7263D; --gold:#E9B949;
  --p0:#5AA9FF; --p0-ink:#06223F; --p1:#FF9147; --p1-ink:#3A1600;
  --ok:#5FD08A; --bad:#FF6B6B;
  --f-display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-num:"Teko", "Barlow", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 500px at 50% -120px,#1d5546 0%,transparent 70%),var(--pitch);color:var(--chalk);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:14px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:24px/1 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:999px;background:var(--board);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--chalk)}
.tbtn{font:600 13px/1 var(--f-body);padding:9px 12px;border-radius:8px;background:var(--board-2);border:1px solid var(--line)}
.tbtn:hover{background:var(--line)}

/* main grid */
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:linear-gradient(180deg,var(--board-2),var(--board));border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.panel.p0{border-top:5px solid var(--p0)} .panel.p1{border-top:5px solid var(--p1)}
.pname{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pname h2{margin:0;font:22px/1.1 var(--f-display);overflow-wrap:anywhere}
.p0 .pname h2{color:var(--p0)} .p1 .pname h2{color:var(--p1)}
.rtm{font:700 11px/1 var(--f-body);letter-spacing:.1em;padding:6px 8px;border-radius:6px;border:1.5px dashed var(--gold);color:var(--gold);white-space:nowrap}
.rtm.used{border-color:var(--faint);color:var(--faint);text-decoration:line-through}
.wallet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--pitch-2);border-radius:10px;padding:8px 10px;min-width:0}
.stat label{display:block;font:600 10.5px/1.1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .num{font-size:30px;line-height:1;display:block;margin-top:4px}
.stat.max .num{color:var(--gold)}
.bar{height:6px;border-radius:6px;background:var(--pitch-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.p0 .bar i{background:var(--p0)} .p1 .bar i{background:var(--p1)}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rule{font:600 12px/1 var(--f-body);padding:6px 8px;border-radius:6px;background:var(--pitch-2);display:flex;gap:6px;align-items:center}
.rule::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad)}
.rule.ok::before{background:var(--ok)}
.squad{display:grid;gap:4px;max-height:420px;overflow:auto;padding-right:2px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--pitch-2);font-size:14px;text-align:left;width:100%}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.srow .pr{font-size:18px;color:var(--muted)}
.srow svg{width:20px;height:20px;color:var(--muted)}
.srow.empty{background:transparent;border:1px dashed var(--line);color:var(--faint);font-size:13px;grid-template-columns:1fr}
button.srow:hover{background:var(--line)}
.srow.cap{outline:2px solid var(--gold)}
.capb{font:700 11px/1 var(--f-body);background:var(--gold);color:#2b1d00;border-radius:4px;padding:3px 5px;margin-left:6px}

/* stage */
.stage{background:linear-gradient(180deg,#184c3f,#123d33);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px;min-width:0;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;left:50%;top:0;width:90px;height:100%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(214,190,140,.10),rgba(214,190,140,.04));pointer-events:none}
.stage>*{position:relative;z-index:1}
.lotlabel{font:600 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--pitch);border:1px solid var(--line);border-radius:14px;padding:14px}
.av{width:118px;height:118px;border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--chalk);box-shadow:0 0 0 4px rgba(0,0,0,.25);position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.av.tier-Platinum{border-color:#C9CCEB}.av.tier-Gold{border-color:var(--gold)}.av.tier-Silver{border-color:#D6D9D8}.av.tier-Bronze{border-color:#D9A77A}.av.tier-Rising{border-color:#8FE0AE}
.fact{font:500 13.5px/1.4 var(--f-body);color:var(--chalk);background:rgba(233,185,73,.10);border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 8px 8px 0;max-width:60ch}
.fact b{color:var(--gold)}
.dyk{max-width:52ch;text-align:left}
.tchip{font:700 11px/1 var(--f-body);letter-spacing:.1em;padding:6px 8px;border-radius:6px;border:1.5px dashed var(--muted);color:var(--muted);white-space:nowrap}
.tchip.used{opacity:.45;text-decoration:line-through}
.cards{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.av svg{width:100%;height:100%;display:block}
.cinfo{min-width:0;display:grid;gap:8px}
.cinfo h3{margin:0;font:clamp(22px,3.2vw,32px)/1.05 var(--f-display);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px/1 var(--f-body);padding:6px 8px;border-radius:6px;background:var(--board-2);display:inline-flex;gap:6px;align-items:center}
.tag svg{width:16px;height:16px}
.tier{color:#1b1400}
.t-Platinum{background:#C9CCEB}.t-Gold{background:var(--gold)}.t-Silver{background:#D6D9D8}.t-Bronze{background:#D9A77A}.t-Rising{background:#8FE0AE}
.flag{display:inline-flex;width:20px;height:13px;border-radius:2px;overflow:hidden}
.flag i{flex:1}
.bidrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.bidbox{background:var(--pitch);border-radius:14px;padding:10px 16px;border:1px solid var(--line);min-width:0}
.bidbox label{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bidbox .amt{font:500 64px/0.95 var(--f-num);display:flex;align-items:baseline;gap:10px;margin-top:6px}
.bidbox .amt small{font:500 22px var(--f-num);color:var(--muted)}
.bidbox .who{font:700 15px/1.2 var(--f-body);margin-top:2px}
.bidbox.lead0{border-color:var(--p0);box-shadow:inset 0 0 0 1px var(--p0)} .bidbox.lead0 .who{color:var(--p0)}
.bidbox.lead1{border-color:var(--p1);box-shadow:inset 0 0 0 1px var(--p1)} .bidbox.lead1 .who{color:var(--p1)}
.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.timer{display:grid;place-items:center;position:relative;width:96px;height:96px}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .t{font:500 40px/1 var(--f-num)}
.status{text-align:center;font:22px/1.1 var(--f-display);min-height:26px;color:var(--gold)}
.status.hot{color:var(--ball);animation:pulse .6s infinite alternate}
@keyframes pulse{to{opacity:.55}}
.bidbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bidcol{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.bb{border-radius:12px;padding:14px 10px;font:700 17px/1.1 var(--f-body);display:grid;gap:2px;justify-items:center;transition:transform .08s,filter .15s}
.bb small{font:600 11px/1 var(--f-body);letter-spacing:.06em;opacity:.8;text-transform:uppercase}
.bb:active:not(:disabled){transform:scale(.97)}
.b0{background:var(--p0);color:var(--p0-ink)} .b1{background:var(--p1);color:var(--p1-ink)}
.bb.j{padding-inline:12px;font-size:15px}
.bb:disabled{filter:grayscale(1) brightness(.55)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.kbd{font:600 11px/1 var(--f-body);color:var(--faint);text-align:center}
.sbtn:disabled{opacity:.4}
.sbtn kbd{font:600 11px/1 var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);margin-left:4px}
.kbd kbd{font:600 11px/1 var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted)}

/* idle / spin */
.spin{display:grid;gap:16px;justify-items:center;text-align:center;padding:18px 0 6px}
.reel{font:clamp(26px,4vw,40px)/1.1 var(--f-display);min-height:1.2em;text-wrap:balance}
.reel.rolling{color:var(--muted)}
.bigbtn{font:22px/1 var(--f-display);padding:18px 28px;border-radius:14px;background:var(--ball);color:#fff;box-shadow:0 6px 0 #7d1121;transition:transform .08s,box-shadow .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1121}
.bigbtn.gold{background:var(--gold);color:#2b1d00;box-shadow:0 6px 0 #8a6a1b}
.banner{font:600 13px/1.4 var(--f-body);background:rgba(233,185,73,.14);border:1px solid var(--gold);color:var(--gold);padding:10px 14px;border-radius:10px;text-align:center;max-width:46ch}
.gavel{width:84px;height:84px;color:var(--chalk)}
.gavel .head{transform-origin:70% 70%;animation:knock 1.6s ease-in-out infinite}
@keyframes knock{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-22deg)}88%{transform:rotate(4deg)}}

/* sold stamp */
.stampwrap{display:grid;place-items:center;gap:10px;padding:8px 0}
.stamp{font:clamp(40px,7vw,64px)/1 var(--f-display);color:var(--ball);border:6px solid var(--ball);padding:6px 22px;border-radius:12px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;background:rgba(0,0,0,.15)}
.stamp.unsold{color:var(--muted);border-color:var(--muted)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.soldto{font:600 18px/1.3 var(--f-body);text-align:center}
.soldto b.c0{color:var(--p0)} .soldto b.c1{color:var(--p1)}

/* rtm */
.rtmbox{display:grid;gap:12px;justify-items:center;text-align:center;background:var(--pitch);border:2px dashed var(--gold);border-radius:14px;padding:16px}
.rtmbox h4{margin:0;font:24px/1.1 var(--f-display);color:var(--gold)}

/* feed */
.feed{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.feed .f{flex:none;font:500 13px/1 var(--f-body);background:var(--board);border:1px solid var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap}
.feed .f b.c0{color:var(--p0)} .feed .f b.c1{color:var(--p1)} .feed .f.u{color:var(--faint)}
.feedrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.feedrow>label{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,16,13,.78);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--board);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;display:grid;gap:14px}
.sheet h2{margin:0;font:26px/1.1 var(--f-display)}
.sheet p{margin:0;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{font:600 17px/1.2 var(--f-body);background:var(--pitch);color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fld.n0 input{border-left:5px solid var(--p0)} .fld.n1 input{border-left:5px solid var(--p1)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold)}
.rulesl{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--chalk);font-size:15px}
.rulesl b{color:var(--gold)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pbtn{font:700 15px/1 var(--f-body);padding:12px 16px;border-radius:10px;background:var(--gold);color:#2b1d00}
.sbtn{font:700 15px/1 var(--f-body);padding:12px 16px;border-radius:10px;background:var(--board-2);border:1px solid var(--line)}
.danger{background:var(--ball);color:#fff}
.pooltbl{width:100%;border-collapse:collapse;font-size:14px}
.pooltbl th{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--board)}
.pooltbl td{padding:7px 6px;border-bottom:1px solid rgba(44,92,78,.5)}
.pooltbl td.num{font-size:18px}
.pooltbl tr.s0 td:first-child{box-shadow:inset 4px 0 var(--p0)} .pooltbl tr.s1 td:first-child{box-shadow:inset 4px 0 var(--p1)}
.pooltbl tr.su{color:var(--faint)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:600 13px/1 var(--f-body);padding:8px 10px;border-radius:8px;background:var(--pitch);border:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#2b1d00;border-color:var(--gold)}

/* reveal */
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rcol{background:var(--pitch);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.rcol h3{margin:0 0 4px;font:22px/1.1 var(--f-display)}
.rcol.c0 h3{color:var(--p0)} .rcol.c1 h3{color:var(--p1)}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--board);font-size:14px}
.rr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .rt{font:500 24px/1 var(--f-num);min-width:42px;text-align:center;border-radius:6px;background:var(--board-2);color:var(--faint)}
.rr.on .rt{background:var(--gold);color:#2b1d00;animation:flip .4s ease-out}
.rr.bonus{background:transparent;border:1px dashed var(--line)}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:8px;margin-top:4px}
.total span{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.total b{font:500 52px/1 var(--f-num)}
.winner{font:clamp(28px,5vw,44px)/1.1 var(--f-display);text-align:center;color:var(--gold);text-wrap:balance}
.hidden-until{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.hidden-until.show{opacity:1;transform:none}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--pitch);font:700 14px/1.2 var(--f-body);padding:10px 16px;border-radius:10px;z-index:50}
textarea.copy{width:100%;min-height:180px;background:var(--pitch);color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.4 var(--f-body)}

/* legends */
.card.legend{border:2px solid var(--gold);background:radial-gradient(400px 160px at 20% 0%,rgba(233,185,73,.22),transparent 70%),var(--pitch);animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(233,185,73,0)}to{box-shadow:0 0 28px rgba(233,185,73,.45)}}
.card.legend .av{border-color:var(--gold)}
.card.legend h3{color:var(--gold)}
.legtag{font:600 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.t-Legend{background:linear-gradient(90deg,#E9B949,#FFE7A3);color:#2b1d00}
.sublabel{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.srow.coach{background:rgba(233,185,73,.12);border:1px solid rgba(233,185,73,.45)}
.srow.coach .nm{white-space:normal}
.spec{display:block;font:500 12px/1.2 var(--f-body);color:var(--gold)}
.rr .spec{display:inline;margin-left:4px}
.rr.coachr{background:rgba(233,185,73,.12);border:1px solid rgba(233,185,73,.45)}
.rr.coachr svg{width:14px;height:14px;vertical-align:-2px}
.srow.coachempty{border-color:rgba(233,185,73,.35)}
.reel.legendreel{color:var(--gold)}

@media (max-width:980px){
  .arena{grid-template-columns:1fr 1fr;grid-template-areas:"stage stage" "p0 p1"}
  .stage{grid-area:stage}.panel.p0{grid-area:p0}.panel.p1{grid-area:p1}
}
@media (max-width:620px){
  body{font-size:15px}
  .arena{gap:10px}
  .panel{padding:10px;gap:10px}
  .wallet{grid-template-columns:1fr 1fr}
  .stat .num{font-size:24px}
  .stat.sl{display:none}
  .pname h2{font-size:18px}
  .card{grid-template-columns:1fr;justify-items:center;text-align:center}
  .meta{justify-content:center}
  .av{width:96px;height:96px}
  .bidbox .amt{font-size:52px}
  .timer{width:80px;height:80px}
  .bidcol{grid-template-columns:1fr}
  .reveal{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .srow{font-size:13px;padding:5px 6px;gap:6px}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="fx"></canvas>
<div id="ov"></div>

<script>

  const co=coaches(i),coach=co.reduce((s,c)=>s+c.rt,0),cboost=co.reduce((s,c)=>s+boost(c,i),0);

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.12,type="sine",g=.18,when=0){const a=ac();if(!a||S.muted)return;const t=a.currentTime+when,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.3,g=.25,freq=900,when=0,q=.7){const a=ac();if(!a||S.muted)return;const t=a.currentTime+when,len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=q;const v=a.createGain();v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+d*.3);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(v).connect(a.destination);s.start(t)}

const fx=document.getElementById("fx"),cx=fx.getContext("2d");let parts=[],fxOn=false;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=120,colors){if(RM)return;fx.width=innerWidth;fx.height=innerHeight;colors=colors||["#E9B949","#D7263D","#F4ECDA","#5AA9FF","#FF9147","#5FD08A"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.4,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:colors[i%colors.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.y<fx.height+30&&p.life<400);if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;cx.clearRect(0,0,fx.width,fx.height)}}

function stage(){

      <button class="bigbtn" data-act="spin" ${ph==="spinning"?"disabled":""}>Spin for next player</button>

       ${c.leader==null?`<button class="sbtn" data-act="unsold">Mark unsold <kbd>U</kbd></button>`:`<button class="sbtn" data-act="hammer">Bang the gavel <kbd>G</kbd></button>`}

     <div class="status" id="tstatus">Decide in <span id="rtmleft" class="num">8</span>…</div></div></section>`;

/* ---------------- game flow ---------------- */
function spin(){
  if(S.phase!=="idle")return;
  const pl=pool(); if(!pl.length){checkEnd();return}
  S.banner=null;S.phase="spinning";render();
  const pick=pl[Math.floor(Math.random()*pl.length)],reel=()=>document.getElementById("reel");
  if(RM){startLot(pick);return}
  let d=45,elapsed=0;
  const step=()=>{const r=reel();if(r){r.textContent=pl[Math.floor(Math.random()*pl.length)].n}SND.spin();elapsed+=d;d*=1.13;
    if(elapsed<1700)ui.reel=setTimeout(step,d);
    else if(isL(pick)){if(r){r.textContent="A LEGEND appears!";r.classList.remove("rolling");r.classList.add("legendreel")}SND.win();confetti(140,["#E9B949","#FFE7A3","#F4ECDA"]);ui.reel=setTimeout(()=>{const r2=reel();if(r2)r2.textContent=pick.n;ui.reel=setTimeout(()=>startLot(pick),900)},900)}
    else{if(r){r.textContent=pick.n;r.classList.remove("rolling")}ui.reel=setTimeout(()=>startLot(pick),450)}};
  step();
}
function anyCanRaise(){const c=S.cur,nb=nextBid();return [0,1].some(i=>c.leader!==i&&lotSlots(i)>0&&nb<=lotMax(i))}
function setClock(c){c.quick=!anyCanRaise();c.dur=c.quick?QUICK:S.timerSec*1000;c.lastSec=null;c.to=null;if(c.paused!=null)c.paused=c.dur;else c.deadline=Date.now()+c.dur}
const canTimeout=i=>S.phase==="live"&&S.timeouts[i]&&S.cur.paused==null&&!S.cur.to&&!S.cur.quick;
function useTimeout(i){if(!canTimeout(i))return;const c=S.cur;S.timeouts[i]=false;c.to={who:i,until:Date.now()+TIMEOUT_MS,left:Math.max(1000,c.deadline-Date.now())};tone(330,.2,"triangle",.15);save();render()}
function startLot(p){S.cur={id:p.id,bid:null,leader:null,paused:null};S.phase="live";setClock(S.cur);tone(440,.15,"triangle",.12);save();render()}
function bid(i,jump){
  if(S.phase!=="live")return;const amt=jump?jumpBid():nextBid();if(bidBlock(i,amt))return;
  const c=S.cur;c.bid=amt;c.leader=i;setClock(c);
  SND.bid();save();render();const bb=document.getElementById("bidbox");if(bb){bb.classList.add("bump")}
}
function updTimer(){
  const c=S.cur;if(!c)return;const left=c.paused!=null?c.paused:Math.max(0,c.deadline-Date.now());
  const frac=Math.min(1,left/(c.dur||S.timerSec*1000)),ring=document.getElementById("ring"),tl=document.getElementById("tleft"),st=document.getElementById("tstatus");
  const sec=Math.ceil(left/1000);
  if(ring){ring.style.strokeDashoffset=(263.9*(1-frac)).toFixed(1);ring.style.stroke=frac<.34?"var(--ball)":"var(--gold)"}
  if(tl)tl.textContent=c.to?Math.ceil((c.to.until-Date.now())/1000):sec;
  if(st){let m,hot=false;if(c.paused!=null)m="Clock paused";else if(c.to)m=`Timeout: ${S.names[c.to.who]} is thinking…`;else if(c.quick){m=c.leader==null?"Nobody can afford him…":"Nobody can raise. Going, going…";hot=true}else if(c.leader==null)m=frac>.34?"Who will open the bidding?":"Last call for an opening bid…";else if(frac>.66)m="Bidding open";else if(frac>.34){m="Going once…"}else{m="Going twice…";hot=true}
    if(st.textContent!==m)st.textContent=m;st.classList.toggle("hot",hot)}
  if(c.paused==null&&!c.to&&sec<=3&&sec>0&&c.lastSec!==sec){c.lastSec=sec;SND.tick()}
  return left;
}
function hammer(){
  const c=S.cur,p=P(c.id);
  if(c.leader==null){markUnsold();return}
  const o=1-c.leader;
  if(S.rtmOn&&S.rtm[o]&&lotSlots(o)>0&&c.bid<=lotMax(o)){S.phase="rtm";c.rtmDeadline=Date.now()+8000;SND.gavel();save();render();return}
  finalize(c.leader,c.bid,false);
}
function finalize(owner,price,viaRtm){
  const c=S.cur,p=P(c.id),prev={owner:p.owner,r2:p.r2,r3:p.r3};p.owner=owner;p.price=price;p.seq=++S.seq;p.rtmUsed=viaRtm;
  if(viaRtm)S.rtm[owner]=false;
  S.log.unshift({id:p.id,n:p.n,owner,price,rtm:viaRtm,round:S.round,prev});
  c.result={owner,price,rtm:viaRtm};S.phase="sold";
  if(!viaRtm)SND.gavel();SND.cheer();save();render();
  confetti(viaRtm?160:90,owner===0?["#5AA9FF","#F4ECDA","#E9B949"]:["#FF9147","#F4ECDA","#E9B949"]);
}
function markUnsold(){
  const c=S.cur,p=P(c.id),prev={owner:p.owner,r2:p.r2,r3:p.r3};if(S.round===2)p.r2=true;if(S.round===3)p.r3=true;p.owner="U";
  S.log.unshift({id:p.id,n:p.n,owner:"U",round:S.round,prev});c.result={owner:"U"};S.phase="sold";SND.sad();save();render();
}
function next(){S.phase="idle";S.cur=null;checkEnd(true)}
const FINALE_MSG="Both squads are full. Legends finale: the legends still unsigned go under the hammer for your coaching staff.";
function toCaptain(msg){S.phase="captain";S.banner=null;save();render();toast(msg)}
function checkEnd(){
  const full=slots(0)<=0&&slots(1)<=0;
  if(full){
    if(finaleOK()){if(S.round!==3){S.round=3;S.banner=FINALE_MSG}S.phase="idle";save();render();return}
    toCaptain("Both squads are full!");return}
  if(!pool().length){
    if(S.round===1&&S.unsoldOn&&S.players.some(p=>p.owner==="U")){S.round=2;S.phase="idle";S.banner="Main round over. Unsold players and legends are back at half price. Fill your empty slots!";save();render();return}
    if(S.round!==3&&finaleOK()){S.round=3;S.banner="No players left. Legends finale: the legends still unsigned go under the hammer.";S.phase="idle";save();render();return}
    toCaptain("Nothing left in the pool");return}
  S.phase="idle";save();render();
}
function undo(){
  const l=S.log.shift();if(!l)return;const p=P(l.id);
  if(l.owner!=="U"&&l.rtm)S.rtm[l.owner]=true;
  Object.assign(p,l.prev||{owner:null,r2:false,r3:false},{price:null,seq:null,rtmUsed:false});
  if(S.round!==l.round){S.round=l.round;S.banner=null}
  S.captains=S.captains.map((c,i)=>c!=null&&P(c).owner===i?c:null);
  S.phase="idle";S.cur=null;save();render();toast(`Undid: ${l.n}`);
}
const revealList=i=>[...team(i),...coaches(i)];
function startReveal(){
  S.phase="reveal";save();render();
  const rows=[...document.querySelectorAll(".rr[data-rv]")],tot=[0,0],cap=S.captains;
  const order=[];const g=[rows.filter(r=>r.dataset.rv==="0"),rows.filter(r=>r.dataset.rv==="1")];
  for(let k=0;k<Math.max(g[0].length,g[1].length);k++){if(g[0][k])order.push(g[0][k]);if(g[1][k])order.push(g[1][k])}
  const teams=[revealList(0),revealList(1)],idx=[0,0];let n=0;
  const stepFn=()=>{
    if(n<order.length){const r=order[n++],i=+r.dataset.rv,p=teams[i][idx[i]++];r.classList.add("on");r.querySelector(".rt").textContent=p.rt;tot[i]+=p.rt;document.getElementById("tot"+i).textContent=tot[i];
      p.rt>=88?tone(880,.12,"triangle",.15):tone(520,.06,"triangle",.08);ui.revealTimer=setTimeout(stepFn,RM?0:380)}
    else{finishReveal()}};
  ui.revealTimer=setTimeout(stepFn,600);
}
function finishReveal(){
  clearTimeout(ui.revealTimer);
  document.querySelectorAll(".rr[data-rv]").forEach(r=>r.classList.add("on"));
  [0,1].forEach(i=>{const t=revealList(i),rows=[...document.querySelectorAll(`.rr[data-rv="${i}"]`)];rows.forEach((r,k)=>{if(t[k])r.querySelector(".rt").textContent=t[k].rt});
    document.querySelector(`[data-bonus="${i}"]`).classList.add("show");document.getElementById("tot"+i).textContent=scoreParts(i).total});
  const w=document.getElementById("winner");if(w)w.classList.add("show");
  if(S.phase!=="done"){S.phase="done";save();SND.win();confetti(220);setTimeout(()=>confetti(160),700);
    const sk=document.querySelector('[data-act="skip"]');if(sk)sk.remove()}
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="bg"&&e.target!==t)return; ac();
  const i=t.dataset.i!=null?+t.dataset.i:null;
  switch(a){
    case "start":{const v=id=>document.getElementById(id);S.names=[v("n0").value.trim()||"Papa",v("n1").value.trim()||"Son"];S.kitty=+v("kitty").value;S.squad=+v("squad").value;S.timerSec=+v("tsec").value;S.rtmOn=v("rtmOn").checked;S.unsoldOn=v("unsoldOn").checked;S.phase="idle";ui.overlay=null;save();render();break}
    case "spin":spin();break;
    case "bid":bid(i,false);break;
    case "jump":bid(i,true);break;
    case "pause":{const c=S.cur;if(c.paused!=null){c.deadline=Date.now()+c.paused;c.paused=null}else{c.paused=Math.max(0,c.deadline-Date.now());c.to=null}save();render();break}
    case "timeout":useTimeout(i);break;
    case "unsold":if(S.phase==="live"&&S.cur.leader==null)markUnsold();break;
    case "hammer":hammer();break;
    case "rtm":t.dataset.yes==="1"?finalize(1-S.cur.leader,S.cur.bid,true):finalize(S.cur.leader,S.cur.bid,false);break;
    case "next":next();break;
    case "undo":undo();break;
    case "finish":ui.overlay="finish";renderOverlay();break;
    case "confirmfinish":ui.overlay=null;S.phase="captain";S.banner=null;save();render();break;
    case "reopen":S.phase="idle";save();render();break;
    case "cap":S.captains[i]=+t.dataset.id;save();render();tone(700,.1,"triangle",.12);break;
    case "reveal":startReveal();break;
    case "skip":finishReveal();break;
    case "copy":{const txt=resultsText();try{navigator.clipboard.writeText(txt).then(()=>toast("Results copied"),()=>{ui.overlay="copy";renderOverlay()})}catch(err){ui.overlay="copy";renderOverlay()}break}
    case "rules":ui.overlay="rules";renderOverlay();break;
    case "pool":ui.overlay="pool";renderOverlay();break;
    case "pf":ui.pool=t.dataset.f;renderOverlay();break;
    case "mute":S.muted=!S.muted;save();render();break;
    case "newgame":ui.overlay="newgame";renderOverlay();break;
    case "confirmnew":{clearTimeout(ui.reel);clearTimeout(ui.revealTimer);const keep={names:S.names,kitty:S.kitty,squad:S.squad,timerSec:S.timerSec,rtmOn:S.rtmOn,unsoldOn:S.unsoldOn,muted:S.muted};S=fresh(keep);ui.overlay=null;save();render();break}
    case "close":case "bg":ui.overlay=null;renderOverlay();if(S.phase==="setup")render();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(ui.overlay&&e.key==="Escape"){ui.overlay=null;renderOverlay();return}
  if(ui.overlay||S.phase==="setup")return;
  const k=e.key.toLowerCase();
  if(k===" "&&S.phase==="idle"){e.preventDefault();ac();spin();return}
  if(S.phase==="sold"&&(k===" "||k==="enter"||k==="n")){e.preventDefault();next();return}
  if(S.phase==="rtm"){if(k==="y")finalize(1-S.cur.leader,S.cur.bid,true);else if(k==="n")finalize(S.cur.leader,S.cur.bid,false);return}
  if(S.phase==="live"){ac();
    if(k==="a")bid(0,false);else if(k==="s")bid(0,true);else if(k==="l")bid(1,false);else if(k==="k")bid(1,true);
    else if(k==="q")useTimeout(0);else if(k==="o")useTimeout(1);
    else if(k==="g"){if(S.cur.leader!=null)hammer();else toast("No bids yet. Press U to mark him unsold.")}
    else if(k==="u"){if(S.cur.leader==null)markUnsold();else toast("There's a bid on the table. Press G to sell him.")}
    else if(k==="p")document.querySelector('[data-act="pause"]')?.click();}
});

/* ---------------- clock ---------------- */
setInterval(()=>{
  if(S.phase==="live"&&S.cur.to&&S.cur.paused==null){const c=S.cur;if(Date.now()>=c.to.until){c.deadline=Date.now()+c.to.left;c.to=null;save();render()}else c.deadline=Date.now()+c.to.left}
  if(S.phase==="live"&&!ui.overlay){const left=updTimer();if(S.cur.paused==null&&left<=0)hammer()}
  else if(S.phase==="live"&&ui.overlay&&S.cur.paused==null){S.cur.deadline+=100}
  if(S.phase==="rtm"){const left=Math.max(0,S.cur.rtmDeadline-Date.now()),el=document.getElementById("rtmleft");if(el)el.textContent=Math.ceil(left/1000);if(left<=0)finalize(S.cur.leader,S.cur.bid,false)}
},100);

/* ---------------- boot ---------------- */
function start(data){
  S=(data&&data.players)?data:(load()||fresh());
  if(S.phase==="spinning")S.phase="idle";
  if(S.phase==="live"&&S.cur&&S.cur.paused==null)S.cur.paused=Math.max(1000,S.cur.deadline-Date.now());
  if(S.phase==="rtm")S.cur.rtmDeadline=Date.now()+8000;
  if(S.cur)S.cur.to=null;
  if(!S.timeouts)S.timeouts=[true,true];
  render();
  if(S.phase==="reveal")finishReveal();
  if(S.phase==="done")finishReveal();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
